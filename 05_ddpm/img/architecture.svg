28 × 14 × 14</text><rect x="487" y="375.5" width="130" height="69" rx="6" fill="#e8f0fb" stroke="#3b5b92" stroke-width="1.5"/><text x="552.0" y="397.5" font-size="12.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">ResBlock (mid)</text><text x="552.0" y="414.5" font-size="12.5" text-anchor="middle" fill="#1a1a1a">128 → 128</text><text x="552.0" y="431.5" font-size="12.5" text-anchor="middle" fill="#2e7d32">+ temb</text><text x="552.0" y="459.5" font-size="11.5" text-anchor="middle" fill="#666">128 × 7 × 7</text><rect x="640" y="235.5" width="130" height="69" rx="6" fill="#e8f0fb" stroke="#3b5b92" stroke-width="1.5"/><text x="705.0" y="257.5" font-size="12.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">ResBlock</text><text x="705.0" y="274.5" font-size="12.5" text-anchor="middle" fill="#1a1a1a">256 → 128</text><text x="705.0" y="291.5" font-size="12.5" text-anchor="middle" fill="#2e7d32">+ temb</text><text x="705.0" y="319.5" font-size="11.5" text-anchor="middle" fill="#666">128 × 14 × 14</text><rect x="640" y="95.5" width="130" height="69" rx="6" fill="#e8f0fb" stroke="#3b5b92" stroke-width="1.5"/><text x="705.0" y="117.5" font-size="12.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">ResBlock</text><text x="705.0" y="134.5" font-size="12.5" text-anchor="middle" fill="#1a1a1a">192 → 64</text><text x="705.0" y="151.5" font-size="12.5" text-anchor="middle" fill="#2e7d32">+ temb</text><text x="705.0" y="179.5" font-size="11.5" text-anchor="middle" fill="#666">64 × 28 × 28</text><rect x="815" y="104.0" width="140" height="52" rx="6" fill="#e8f0fb" stroke="#3b5b92" stroke-width="1.5"/><text x="885.0" y="126.0" font-size="12.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">GroupNorm · SiLU</text><text x="885.0" y="143.0" font-size="12.5" text-anchor="middle" fill="#1a1a1a">Conv 3×3 64 → 1</text><text x="885.0" y="171.0" font-size="11.5" text-anchor="middle" fill="#666">1 × 28 × 28</text><rect x="990" y="104.0" width="90" height="52" rx="6" fill="#fff3c4" stroke="#a68a00" stroke-width="1.5"/><text x="1035.0" y="126.0" font-size="12.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">ε̂</text><text x="1035.0" y="143.0" font-size="12.5" text-anchor="middle" fill="#1a1a1a">predicted noise</text><line x1="130" y1="130" x2="163" y2="130" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/><line x1="285" y1="130" x2="318" y2="130" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/><line x1="770" y1="130" x2="813" y2="130" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/><line x1="955" y1="130" x2="988" y2="130" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/><line x1="385" y1="165" x2="385" y2="235" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/><text x="393" y="222.0" font-size="11.5" text-anchor="start" fill="#666">AvgPool 2×</text><path d="M385 305 V410 H485" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/><text x="393" y="362.0" font-size="11.5" text-anchor="start" fill="#666">AvgPool 2×</text><path d="M617 410 H755 V305" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/><text x="763" y="362.0" font-size="11.5" text-anchor="start" fill="#666">Upsample 2×</text><line x1="755" y1="235" x2="755" y2="165" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/><text x="763" y="222.0" font-size="11.5" text-anchor="start" fill="#666">Upsample 2×</text><line x1="450" y1="130" x2="638" y2="130" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#r)"/><text x="544" y="120" font-size="11.5" text-anchor="middle" fill="#c0392b">skip h1 · concat (64 + 128 ch)</text><line x1="450" y1="270" x2="638" y2="270" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#r)"/><text x="544" y="260" font-size="11.5" text-anchor="middle" fill="#c0392b">skip h2 · concat (128 + 128 ch)</text><rect x="28" y="499.0" width="100" height="52" rx="6" fill="#fff3c4" stroke="#a68a00" stroke-width="1.5"/><text x="78.0" y="521.0" font-size="12.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">t</text><text x="78.0" y="538.0" font-size="12.5" text-anchor="middle" fill="#1a1a1a">timestep</text><rect x="158" y="499.0" width="160" height="52" rx="6" fill="#e8f0fb" stroke="#3b5b92" stroke-width="1.5"/><text x="238.0" y="521.0" font-size="12.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Sinusoidal embedding</text><text x="238.0" y="538.0" font-size="12.5" text-anchor="middle" fill="#1a1a1a">sin / cos, 128 values</text><rect x="348" y="499.0" width="190" height="52" rx="6" fill="#e8f0fb" stroke="#3b5b92" stroke-width="1.5"/><text x="443.0" y="521.0" font-size="12.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">MLP</text><text x="443.0" y="538.0" font-size="12.5" text-anchor="middle" fill="#1a1a1a">Linear · SiLU · Linear</text><rect x="568" y="499.0" width="90" height="52" rx="6" fill="#e3f4e6" stroke="#2e7d32" stroke-width="1.5"/><text x="613.0" y="521.0" font-size="12.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">temb</text><text x="613.0" y="538.0" font-size="12.5" text-anchor="middle" fill="#1a1a1a">128</text><line x1="128" y1="525" x2="156" y2="525" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/><line x1="318" y1="525" x2="346" y2="525" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/><line x1="538" y1="525" x2="566" y2="525" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/><text x="700" y="508" font-size="12" text-anchor="start" fill="#2e7d32">temb → Linear → one value per channel, added inside</text><text x="700" y="524" font-size="12" text-anchor="start" fill="#2e7d32">every ResBlock (green “+ temb”), so each block</text><text x="700" y="540" font-size="12" text-anchor="start" fill="#2e7d32">knows how noisy its input is.</text><text x="550" y="600" font-size="12" text-anchor="middle" fill="#555">ResBlock = GroupNorm → SiLU → Conv 3×3 → (+ temb) → GroupNorm → SiLU → Conv 3×3, plus a shortcut from its input.</text><text x="550" y="24" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">U-Net ε_θ(x_t, t): predicts the noise contained in x_t (1.34 M parameters)</text></svg>

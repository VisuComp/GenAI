<rect width="1290" height="480" fill="#fff"/>
<rect x="10" y="30" width="770" height="290" rx="10" fill="#eef3fb" stroke="#bbb" stroke-dasharray="4 3"/><text x="22" y="52" font-size="15" font-weight="bold" fill="#333" text-anchor="start">Encoder  q(z | x)</text><rect x="790" y="30" width="459" height="290" rx="10" fill="#fdf4ec" stroke="#bbb" stroke-dasharray="4 3"/><text x="802" y="52" font-size="15" font-weight="bold" fill="#333" text-anchor="start">Decoder  p(x | z)</text><rect x="28" y="144.0" width="80" height="52" rx="6" fill="#fff3c4" stroke="#a68a00" stroke-width="1.5"/><text x="68.0" y="166.0" font-size="12.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">x</text><text x="68.0" y="183.0" font-size="12.5" text-anchor="middle" fill="#1a1a1a">image</text><text x="68.0" y="211.0" font-size="11.5" text-anchor="middle" fill="#666">784</text><rect x="134" y="144.0" width="125" height="52" rx="6" fill="#e8f0fb" stroke="#3b5b92" stroke-width="1.5"/><text x="196.5" y="166.0" font-size="12.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Linear 784 → 512</text><text x="196.5" y="183.0" font-size="12.5" text-anchor="middle" fill="#1a1a1a">ReLU</text><rect x="285" y="144.0" width="125" height="52" rx="6" fill="#e8f0fb" stroke="#3b5b92" stroke-width="1.5"/><text x="347.5" y="166.0" font-size="12.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Linear 512 → 256</text><text x="347.5" y="183.0" font-size="12.5" text-anchor="middle" fill="#1a1a1a">ReLU</text><line x1="108" y1="170" x2="132" y2="170" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/><line x1="259" y1="170" x2="283" y2="170" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/><rect x="448" y="79.0" width="140" height="52" rx="6" fill="#e8f0fb" stroke="#3b5b92" stroke-width="1.5"/><text x="518.0" y="101.0" font-size="12.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">μ head</text><text x="518.0" y="118.0" font-size="12.5" text-anchor="middle" fill="#1a1a1a">Linear 256 → d</text><rect x="448" y="209.0" width="140" height="52" rx="6" fill="#e8f0fb" stroke="#3b5b92" stroke-width="1.5"/><text x="518.0" y="231.0" font-size="12.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">log σ² head</text><text x="518.0" y="248.0" font-size="12.5" text-anchor="middle" fill="#1a1a1a">Linear 256 → d</text><line x1="410" y1="170" x2="446" y2="105" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/><line x1="410" y1="170" x2="446" y2="235" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/><rect x="626" y="144.0" width="140" height="52" rx="6" fill="#e3f4e6" stroke="#2e7d32" stroke-width="1.5"/><text x="696.0" y="166.0" font-size="12.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">z = μ + σ ⊙ ε</text><text x="696.0" y="183.0" font-size="12.5" text-anchor="middle" fill="#1a1a1a">reparameterization</text><line x1="588" y1="105" x2="624" y2="158" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/><line x1="588" y1="235" x2="624" y2="182" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/><rect x="626" y="334.0" width="140" height="52" rx="6" fill="#e3f4e6" stroke="#2e7d32" stroke-width="1.5"/><text x="696.0" y="356.0" font-size="12.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">ε ~ N(0, I)</text><text x="696.0" y="373.0" font-size="12.5" text-anchor="middle" fill="#1a1a1a">random noise</text><line x1="696.0" y1="334" x2="696.0" y2="197" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/><rect x="818" y="144.0" width="125" height="52" rx="6" fill="#e8f0fb" stroke="#3b5b92" stroke-width="1.5"/><text x="880.5" y="166.0" font-size="12.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Linear d → 256</text><text x="880.5" y="183.0" font-size="12.5" text-anchor="middle" fill="#1a1a1a">ReLU</text><rect x="969" y="144.0" width="125" height="52" rx="6" fill="#e8f0fb" stroke="#3b5b92" stroke-width="1.5"/><text x="1031.5" y="166.0" font-size="12.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Linear 256 → 512</text><text x="1031.5" y="183.0" font-size="12.5" text-anchor="middle" fill="#1a1a1a">ReLU</text><rect x="1120" y="144.0" width="115" height="52" rx="6" fill="#e8f0fb" stroke="#3b5b92" stroke-width="1.5"/><text x="1177.5" y="166.0" font-size="12.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Linear 512 → 784</text><text x="1177.5" y="183.0" font-size="12.5" text-anchor="middle" fill="#1a1a1a">(logits)</text><text x="1177.5" y="211.0" font-size="11.5" text-anchor="middle" fill="#666">sigmoid → x̂</text><line x1="943" y1="170" x2="967" y2="170" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/><line x1="1094" y1="170" x2="1118" y2="170" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/><line x1="767" y1="170" x2="816" y2="170" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/><rect x="433" y="374.0" width="215" height="52" rx="6" fill="#fbe3e0" stroke="#c0392b" stroke-width="1.5"/><text x="540.5" y="396.0" font-size="12.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">KL term (from μ and log σ²)</text><text x="540.5" y="413.0" font-size="12.5" text-anchor="middle" fill="#1a1a1a">−½ Σ(1 + log σ² − μ² − σ²)</text><path d="M518.0 262 V373" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#r)"/><rect x="1087.5" y="374.0" width="180" height="52" rx="6" fill="#fbe3e0" stroke="#c0392b" stroke-width="1.5"/><text x="1177.5" y="396.0" font-size="12.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Reconstruction term</text><text x="1177.5" y="413.0" font-size="12.5" text-anchor="middle" fill="#1a1a1a">BCE(x̂, x)</text><path d="M1177.5 215 V373" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#r)"/><text x="645" y="468" font-size="12.5" text-anchor="middle" fill="#555">loss = BCE(x̂, x) + KL(q(z|x) ‖ N(0, I));  d = latent dimension (default 2). The encoder outputs a distribution, not a single code.</text></svg>
